name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_TOMTOM_API_KEY: ${{ secrets.VITE_TOMTOM_API_KEY || secrets.TOMTOM_API_KEY || vars.VITE_TOMTOM_API_KEY || vars.TOMTOM_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Vite env
        run: |
          if [ -z "${VITE_TOMTOM_API_KEY}" ]; then
            echo "::error::VITE_TOMTOM_API_KEY is empty. Add it as a repository secret under Settings → Secrets and variables → Actions. Do not use the github-pages environment — GitHub Pages blocks main from deploying there."
            exit 1
          fi
          echo "VITE_TOMTOM_API_KEY is present (${#VITE_TOMTOM_API_KEY} characters)."
          printf 'VITE_TOMTOM_API_KEY=%s\n' "${VITE_TOMTOM_API_KEY}" > .env.production

      - name: Build
        run: npm run build

      - name: Confirm TomTom key was baked in
        run: |
          node <<'NODE'
          const { readdirSync, readFileSync } = require("node:fs");
          const files = readdirSync("dist/assets").filter((name) => name.endsWith(".js"));
          const bundle = files.map((name) => readFileSync(`dist/assets/${name}`, "utf8")).join("\n");
          if (!bundle.includes("maps/orbis/display")) {
            console.error("Vite built without TomTom display tiles. The key did not reach import.meta.env.VITE_TOMTOM_API_KEY.");
            process.exit(1);
          }
          console.log("TomTom display tiles are present in the production bundle.");
          NODE

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          enable_nojekyll: true
